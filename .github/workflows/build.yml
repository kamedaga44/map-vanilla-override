name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Direct Class Compilation
        run: |
          mkdir -p bin
          javac -d bin src/main/java/com/mapoverride/mixin/ViewModelBypassMixin.java
          cp src/main/resources/fabric.mod.json bin/
          cp src/main/resources/map_vanilla_override.mixins.json bin/
          cd bin
          jar cvf map-vanilla-override-1.0.0.jar .
          mkdir -p ../out
          mv map-vanilla-override-1.0.0.jar ../out/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-vanilla-override-1.0.0
          path: out/*.jar
